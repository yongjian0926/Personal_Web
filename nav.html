<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0b0b0b; color: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
    
    /* 导航栏样式 */
    nav { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 1.2rem 5%; background: #0b0b0b; 
      position: fixed; width: 100%; top: 0; z-index: 100; border-bottom: 1px solid #333; 
    }
    .logo { font-size: 1.4rem; letter-spacing: 3px; font-weight: bold; color: #fff; text-transform: uppercase; text-decoration: none; transition: 0.3s; white-space: nowrap; }
    .logo:hover { color: #d4af37; }
    
    .nav-right-container { display: flex; align-items: center; gap: 2.5rem; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { color: #aaa; text-decoration: none; letter-spacing: 2px; font-size: 0.9rem; transition: 0.3s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: #d4af37; }
    
    .lang-btn { 
      background: transparent; border: 1px solid #444; color: #fff; 
      padding: 4px 10px; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px; 
      transition: 0.3s; white-space: nowrap; border-radius: 4px;
    }
    .lang-btn:hover { border-color: #d4af37; color: #d4af37; }

    /* Apple 官网动画汉堡包按钮 */
    .menu-toggle {
      display: none; position: relative;
      width: 18px; height: 18px; 
      background: transparent; border: none; cursor: pointer; padding: 0; z-index: 101;
    }
    .menu-toggle .bar { 
      position: absolute; left: 0;
      width: 100%; height: 2px; 
      background-color: #e5e5e5; border-radius: 1px; 
      transition: transform 0.35s cubic-bezier(0.52, 0.16, 0.52, 0.84), top 0.35s cubic-bezier(0.52, 0.16, 0.52, 0.84); 
    }

    .menu-toggle .bar:nth-child(1) { top: 4px; }
    .menu-toggle .bar:nth-child(2) { top: 12px; }

    .menu-toggle.active .bar:nth-child(1) {
      top: 8px;
      transform: rotate(45deg);
    }
    .menu-toggle.active .bar:nth-child(2) {
      top: 8px;
      transform: rotate(-45deg);
    }

    @media (max-width: 1024px) {
      nav { padding: 1.1rem 6%; }
      .logo { font-size: 1.1rem; letter-spacing: 2px; }
      .menu-toggle { display: block; }

      .nav-right-container { gap: 16px; }
      
      /* Apple 风格全屏抽屉菜单容器 */
      .nav-links {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #0b0b0b;
        flex-direction: column; align-items: flex-start; justify-content: flex-start;
        padding: 100px 10% 40px 10%; gap: 24px;
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity 0.35s cubic-bezier(0.52, 0.16, 0.24, 1), visibility 0.35s ease;
        z-index: 99;
      }
      .nav-links.active { opacity: 1; visibility: visible; pointer-events: auto; }

      /* 菜单项默认状态（隐藏向上偏移） */
      .nav-links a {
        font-size: 1.65rem; font-weight: 600; letter-spacing: 1.5px;
        color: #e5e5e5; width: 100%; display: block; padding: 4px 0;
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity 0.4s cubic-bezier(0.52, 0.16, 0.24, 1), transform 0.4s cubic-bezier(0.52, 0.16, 0.24, 1), color 0.3s;
      }

      /* 激活时按延迟顺序从上到下逐个滑入显示 */
      .nav-links.active a {
        opacity: 1;
        transform: translateY(0);
      }

      .nav-links.active a:nth-child(1) { transition-delay: 0.1s; }
      .nav-links.active a:nth-child(2) { transition-delay: 0.16s; }
      .nav-links.active a:nth-child(3) { transition-delay: 0.22s; }
      .nav-links.active a:nth-child(4) { transition-delay: 0.28s; }

      .nav-links a:hover, .nav-links a.active { color: #d4af37; }
    }

    /* 主内容布局 */
    .nav-container { padding: 140px 5% 60px 5%; max-width: 1200px; margin: 0 auto; }
    .page-title { font-size: 2rem; letter-spacing: 4px; text-align: center; margin-bottom: 3rem; color: #d4af37; }

    /* 分类板块 */
    .category-section { margin-bottom: 40px; }
    .category-title { 
      font-size: 1.2rem; color: #fff; border-left: 3px solid #d4af37; 
      padding-left: 12px; margin-bottom: 20px; letter-spacing: 1.5px; 
    }

    /* 网址卡片网格 */
    .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    
    .nav-card {
      background: #141414; border: 1px solid #222; border-radius: 8px;
      padding: 18px 20px; text-decoration: none; color: #fff;
      display: flex; flex-direction: column; gap: 8px;
      cursor: pointer; transition: all 0.3s ease;
    }
    .nav-card:hover {
      border-color: #d4af37; transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.1);
    }
    .card-header { display: flex; align-items: center; gap: 12px; }
    
    .compass-icon {
      width: 22px; height: 22px; stroke: #ffffff; fill: none; flex-shrink: 0;
    }

    .card-title { font-size: 1.05rem; font-weight: 600; color: #f4f4f4; }
    .card-desc { 
      font-size: 0.85rem; color: #888; line-height: 1.4; 
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* 模态弹窗样式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-card {
      background: #181818; border: 1px solid #333; border-radius: 12px;
      width: 100%; max-width: 480px; padding: 24px; position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transform: translateY(20px); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-card { transform: translateY(0); }

    .modal-close {
      position: absolute; top: 16px; right: 16px; background: transparent;
      border: none; color: #888; font-size: 1.5rem; cursor: pointer;
      line-height: 1; transition: color 0.2s;
    }
    .modal-close:hover { color: #fff; }

    .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 1.25rem; font-weight: 600; color: #fff; }
    .modal-desc { font-size: 0.95rem; color: #bbb; line-height: 1.6; margin-bottom: 24px; }

    .modal-footer { display: flex; justify-content: flex-end; }
    
    .modal-visit-btn {
      background: #d4af37; color: #000; font-weight: 600; padding: 8px 22px;
      border-radius: 6px; text-decoration: none; font-size: 0.9rem;
      letter-spacing: 1px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .modal-visit-btn:hover { background: #f0c848; transform: translateY(-1px); }

    @media (max-width: 600px) {
      .nav-container { padding-top: 110px; }
      .nav-grid { grid-template-columns: 1fr; }
    }

    /* ===== 主题切换按钮与浅色主题 ===== */
    html { color-scheme: dark; }
    html.light { color-scheme: light; }
    .theme-btn {
      background: transparent; border: 1px solid #444; color: #fff;
      padding: 4px 8px; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px;
      transition: 0.3s; white-space: nowrap; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-btn:hover { border-color: #d4af37; color: #d4af37; }
    .theme-btn svg { width: 14px; height: 14px; display: block; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* 语言与主题按钮统一规格：等高、无边框透明底、桌面手机完全一致；两按钮间竖线分隔 */

    .nav-divider { width: 1px; height: 18px; background: #555; }
    html.light .nav-divider { background: #c2bdb2; }
    .lang-btn, .theme-btn {
      height: 30px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; border-radius: 0;
    }

    html.light body { background-color: #f7f6f3; color: #26262a; }
    html.light nav { background: #ffffff; border-bottom-color: #ddd8cf; }
    html.light .logo { color: #17171a; }
    html.light .nav-links a { color: #5a5a60; }
    html.light .lang-btn, html.light .theme-btn { color: #17171a; border-color: #c9c4ba; }
    html.light .menu-toggle .bar { background-color: #3a3a3e; }
    html.light .category-title { color: #17171a; }
    html.light .nav-card { background: #fff; border-color: #ddd8cf; color: #17171a; }
    html.light .nav-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    html.light .compass-icon { stroke: #8a6d1f; }
    html.light .card-title { color: #17171a; }
    html.light .card-desc { color: #6a6a70; }
    html.light .modal-overlay { background: rgba(30,30,30,0.35); }
    html.light .modal-card { background: #fff; border-color: #e2ddd3; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    html.light .modal-close { color: #8a8a90; }
    html.light .modal-close:hover { color: #17171a; }
    html.light .modal-title { color: #17171a; }
    html.light .modal-desc { color: #4a4a50; }
    @media (max-width: 1024px) {
      html.light .nav-links { background-color: #f7f6f3; }
      html.light .nav-links a { color: #2b2b30; }
    }
  </style>

    let currentLang = 'en';

    // 渲染导航内容
    function renderNav() {
      const data = navData[currentLang];

      document.getElementById('nav-about').innerText = data.navAbout;
      document.getElementById('nav-gallery').innerText = data.navGallery;
      document.getElementById('nav-utility').innerText = data.navUtility;
      document.getElementById('nav-nav').innerText = data.navNav;
      document.getElementById('lang-btn').innerText = data.langBtn;
      document.getElementById('page-title').innerText = data.pageTitle;

      const container = document.getElementById('navigation-content');
      container.innerHTML = '';

      data.categories.forEach(cat => {
        const section = document.createElement('div');
        section.className = 'category-section';

        let gridHtml = `<h3 class="category-title">${cat.title}</h3><div class="nav-grid">`;

        cat.items.forEach(item => {
          const nameEscaped = item.name.replace(/'/g, "\\'");
          const descEscaped = item.desc.replace(/'/g, "\\'");

          gridHtml += `
            <div class="nav-card" onclick="openModal('${nameEscaped}', '${descEscaped}', '${item.url}')">
              <div class="card-header">
                ${compassSvg}
                <span class="card-title">${item.name}</span>
              </div>
              <p class="card-desc">${item.desc}</p>
            </div>
          `;
        });

        gridHtml += `</div>`;
        section.innerHTML = gridHtml;
        container.appendChild(section);
      });
    }

    // 弹窗打开控制
    function openModal(title, desc, url) {
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');
      const modalVisitBtn = document.getElementById('modalVisitBtn');

      modalTitle.innerText = title;
      modalDesc.innerText = desc;
      modalVisitBtn.href = url;
      modalVisitBtn.innerText = navData[currentLang].visitBtnText;

      modalOverlay.classList.add('active');
    }

    // 弹窗关闭控制（点击背景关闭）
    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        closeModalDirect();
      }
    }

    // 直接关闭弹窗
    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // 监听 ESC 按键关闭弹窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    // 切换语言
    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      renderNav();
    }

    // 页面初始化加载
    renderNav();

    /* ===== 深浅色主题：与全站共用 yw_calc_theme 键，默认跟随系统 ===== */
    const THEME_SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
    const THEME_MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>';
    function siteTheme() {
      let saved = null;
      try { saved = localStorage.getItem('yw_calc_theme'); } catch (e) { /* 忽略 */ }
      if (saved === 'light' || saved === 'dark') return saved;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    function applySiteTheme(mode) {
      document.documentElement.classList.toggle('light', mode === 'light');
      const icon = document.getElementById('theme-icon');
      if (icon) icon.innerHTML = (mode === 'light') ? THEME_MOON : THEME_SUN;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'light' ? '#f7f6f3' : '#0b0b0b');
    }
    function toggleTheme() {
      const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
      try { localStorage.setItem('yw_calc_theme', next); } catch (e) { /* 忽略 */ }
      applySiteTheme(next);
    }
    applySiteTheme(siteTheme());
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
        let saved = null;
        try { saved = localStorage.getItem('yw_calc_theme'); } catch (err) { /* 忽略 */ }
        if (saved !== 'light' && saved !== 'dark') applySiteTheme(e.matches ? 'light' : 'dark');
      });
    }
  </script>
