    function ggColor() { return PLOT_COLORS[ggObjects.length % PLOT_COLORS.length]; }
    function ggById(id) {

    /* ---------- 撤销 / 重做 ---------- */
    function ggSnapshot() {

      }));
    }
    function ggPushHistory() {

      ggFuture.length = 0;

    }
    function ggRestore(snap) {
      ggObjects = JSON.parse(snap);
      ggObjects.forEach(function (o) {

    function ggUndo() { if (!ggHistory.length) return; ggFuture.push(ggSnapshot()); ggRestore(ggHistory.pop()); }

    /* ---------- 变量环境：x + 所有数值对象（类似 GeoGebra 滑杆） ---------- */
    function ggVarNames() {
      const names = ['x'];
      ggObjects.forEach(function (o) { if (o.kind === 'number') names.push(o.name); });
      return names;
    }
    function ggVars(x) {
      const v = { x: x };
      ggObjects.forEach(function (o) { if (o.kind === 'number') v[o.name] = o.value; });
      return v;
    }
    function ggCompileFunc(def) {

    /* ---------- 几何求解 ---------- */
    function ggPointXY(o) {

    /* 直线类对象 → {px, py, m, vert, x0} */

    function segCircle(seg, c, r) {

      const out = [];
      [(-B + Math.sqrt(disc)) / (2 * A), (-B - Math.sqrt(disc)) / (2 * A)].forEach(function (t) {

    }
    function lineCircle(L, c, r) {
      if (L.vert) {

        if (dy2 < 0) return [];

    /* 两对象交点（最多 8 个） */

    /* ---------- 测量值 ---------- */

    function ggIntegrate(ast, a, b) {

      const h = (b - a) / n;
      let s = ggEval(ast, a) + ggEval(ast, b);
      for (let i = 1; i < n; i++) s += ggEval(ast, a + h * i) * (i % 2 ? 4 : 2);
      return s * h / 3;
    }

    /* ---------- 视图 / 画布 ---------- */
    function plotGeomSafe() {
      const canvas = document.getElementById('plotCanvas');
      if (!canvas || !canvas.width) return null;
      return plotGeom();
    }
    function plotGeom() {
      const canvas = document.getElementById('plotCanvas');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = canvas.width / dpr, h = canvas.height / dpr;
      const v = plotView;
      return {
        canvas: canvas, ctx: canvas.getContext('2d'), dpr: dpr, w: w, h: h,
        xMin: v.cx - w / (2 * v.sx), xMax: v.cx + w / (2 * v.sx),
        yMin: v.cy - h / (2 * v.sy), yMax: v.cy + h / (2 * v.sy),
        toPx: function (x, y) { return [(x - v.cx) * v.sx + w / 2, h / 2 - (y - v.cy) * v.sy]; },
        toVal: function (px, py) { return [(px - w / 2) / v.sx + v.cx, (h / 2 - py) / v.sy + v.cy]; }
      };
    }
    function niceStep(minPx, scale) {
      const raw = minPx / scale;
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const m = raw / pow;
      const nice = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10;
      return nice * pow;
    }
    function resizePlotCanvas() {
      const canvas = document.getElementById('plotCanvas');
      const wrap = document.getElementById('ggCanvasWrap');
      if (!canvas || !wrap) return;
      const w = Math.max(240, wrap.clientWidth);
      const h = Math.max(240, wrap.clientHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      drawPlot();
    }
    function zoomPlot(factor, anchorPx, anchorPy) {
      const g = plotGeomSafe();
      if (!g) return;
      const ax = anchorPx === undefined ? g.w / 2 : anchorPx;
      const ay = anchorPy === undefined ? g.h / 2 : anchorPy;
      const before = g.toVal(ax, ay);
      const nsx = Math.max(0.0005, Math.min(2e7, plotView.sx * factor));
      const nsy = Math.max(0.0005, Math.min(2e7, plotView.sy * factor));
      if (nsx === plotView.sx && nsy === plotView.sy) return;
      plotView.sx = nsx; plotView.sy = nsy;
      const after = plotGeom().toVal(ax, ay);
      plotView.cx += before[0] - after[0];
      plotView.cy += before[1] - after[1];
      drawPlot();
    }
    function resetPlotView() {
      plotView.cx = 0; plotView.cy = 0; plotView.sx = 40; plotView.sy = 40;
      plotHover = null;
      drawPlot();
    }
    /* 全屏图标：进入=四角外扩箭头；退出=两枚箭头相对指向中心 */
    const GG_FULL_ENTER_SVG = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>';
    const GG_FULL_EXIT_SVG = '<svg viewBox="0 0 24 24"><path d="M4 4l6 6M10 10V6M10 10H6M20 20l-6-6M14 14v4M14 14h4"/></svg>';
    function ggToggleFull() {
      const shell = document.querySelector('.gg-shell');
      if (!shell) return;
      const on = shell.classList.toggle('gg-full');
      const btn = document.getElementById('zb-full');
      if (btn) {
        btn.classList.toggle('on', on);
        btn.innerHTML = on ? GG_FULL_EXIT_SVG : GG_FULL_ENTER_SVG;
        btn.title = on ? T().ggFullExit : T().ggFull;
      }
      /* 布局变化后重测画布尺寸 */
      requestAnimationFrame(resizePlotCanvas);
    }
    function ggSnapVal(v) {
      if (!ggOpts.snap) return v;
      const g = plotGeomSafe();
      if (!g) return v;
      const stx = niceStep(72, plotView.sx), sty = niceStep(72, plotView.sy);
      return [Math.round(v[0] / stx) * stx, Math.round(v[1] / sty) * sty];
    }

    /* ---------- 渲染 ---------- */
    function drawPlot() {
      const g = plotGeomSafe();
      if (!g) return;
      const ctx = g.ctx;
      const ct = canvasTheme();
      ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
      ctx.clearRect(0, 0, g.w, g.h);
      ctx.fillStyle = ct.bg;
      ctx.fillRect(0, 0, g.w, g.h);

      const stepX = niceStep(72, plotView.sx);
      const stepY = niceStep(72, plotView.sy);

      if (ggOpts.grid) {
        if (ggOpts.minor) {
          ctx.strokeStyle = ct.gridMinor;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = Math.ceil(g.xMin / (stepX / 5)) * (stepX / 5); x <= g.xMax; x += stepX / 5) {
            const px = g.toPx(x, 0)[0]; ctx.moveTo(px, 0); ctx.lineTo(px, g.h);
          }
          for (let y = Math.ceil(g.yMin / (stepY / 5)) * (stepY / 5); y <= g.yMax; y += stepY / 5) {
            const py = g.toPx(0, y)[1]; ctx.moveTo(0, py); ctx.lineTo(g.w, py);
          }
          ctx.stroke();
        }
        ctx.strokeStyle = ct.gridMajor;
        ctx.beginPath();
        for (let x = Math.ceil(g.xMin / stepX) * stepX; x <= g.xMax; x += stepX) {
          const px = g.toPx(x, 0)[0]; ctx.moveTo(px, 0); ctx.lineTo(px, g.h);
        }
        for (let y = Math.ceil(g.yMin / stepY) * stepY; y <= g.yMax; y += stepY) {
          const py = g.toPx(0, y)[1]; ctx.moveTo(0, py); ctx.lineTo(g.w, py);
        }
        ctx.stroke();
      }

      if (ggOpts.axes) {
        const o = g.toPx(0, 0);
        const axisX = Math.max(0, Math.min(g.h - 1, o[1]));
        const axisY = Math.max(0, Math.min(g.w - 1, o[0]));
        ctx.strokeStyle = ct.axis;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, axisX); ctx.lineTo(g.w, axisX);
        ctx.moveTo(axisY, 0); ctx.lineTo(axisY, g.h);
        ctx.stroke();
        if (ggOpts.labels) {
          ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
          ctx.fillStyle = ct.label;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          const labelY = Math.min(Math.max(axisX + 6, 4), g.h - 16);
          for (let x = Math.ceil(g.xMin / stepX) * stepX; x <= g.xMax; x += stepX) {
            if (Math.abs(x) < stepX / 1e6) continue;
            const px = g.toPx(x, 0)[0];
            if (px < 16 || px > g.w - 16) continue;
            ctx.fillText(fmtTick(x, stepX), px, labelY);
          }
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          const labelX = Math.min(Math.max(axisY + 7, 4), g.w - 46);
          for (let y = Math.ceil(g.yMin / stepY) * stepY; y <= g.yMax; y += stepY) {
            if (Math.abs(y) < stepY / 1e6) continue;
            const py = g.toPx(0, y)[1];
            if (py < 12 || py > g.h - 12) continue;
            ctx.fillText(fmtTick(y, stepY), labelX, py);
          }
          ctx.fillStyle = ct.name;
          ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
          ctx.fillText('x', g.w - 4, Math.min(axisX - 6, g.h - 4));
          ctx.textAlign = 'left'; ctx.textBaseline = 'top';
          ctx.fillText('y', Math.min(axisY + 8, g.w - 14), 4);
        }
      }

      /* 对象按代数区顺序绘制 */
      ggObjects.forEach(function (o) {
        if (o.visible === false) return;
        ggDrawObject(ctx, g, o, ct);
      });

      /* 作图草稿预览 */
      if (ggDraftPoly && ggDraftPoly.length) {
        ctx.strokeStyle = ct.draft;
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ggDraftPoly.forEach(function (id, i) {
          const p = ggPointXY(ggById(id));
          if (!p) return;
          const pp = g.toPx(p[0], p[1]);
          if (i === 0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
        });
        if (plotHover) { ctx.lineTo(plotHover.x, plotHover.y); }
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (ggPending.length && (ggTool === 'line' || ggTool === 'segment' || ggTool === 'circle')) {
        ctx.strokeStyle = ct.draft;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        const p = ggPointXY(ggPending[0].obj ? ggPending[0].obj : ggPending[0]);
        if (p) {
          const pp = g.toPx(p[0], p[1]);
          ctx.moveTo(pp[0], pp[1]);
          if (plotHover) ctx.lineTo(plotHover.x, plotHover.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      /* 悬停十字线与吸附提示 */
      if (plotHover && ggTool === 'move') {
        const hv = g.toVal(plotHover.x, plotHover.y);
        const snapPt = ggNearestPoint(hv, 14);
        if (snapPt) {
          const sp = g.toPx(snapPt[0], snapPt[1]);
          ctx.strokeStyle = ct.draft;
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(sp[0], 0); ctx.lineTo(sp[0], g.h);
          ctx.moveTo(0, sp[1]); ctx.lineTo(g.w, sp[1]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ggUpdateStatus();
    }

    function ggDrawObject(ctx, g, o, ct) {
      const col = o.color || '#d4af37';
      const th = ct || canvasTheme();
      ctx.lineWidth = o.width || 2;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;

      if (o.kind === 'func' && o.ast) {
        ctx.lineWidth = o.width || 2.2;
        ctx.shadowColor = col; ctx.shadowBlur = 5;
        ctx.beginPath();
        let started = false, prevPy = null;
        const n = Math.max(240, Math.round(g.w * 2));
        for (let i = 0; i <= n; i++) {
          const px = (i / n) * g.w;
          const xv = g.toVal(px, 0)[0];
          const yv = ggEval(o.ast, xv);
          if (!isFinite(yv)) { started = false; prevPy = null; continue; }
          const py = g.toPx(xv, yv)[1];
          const jump = prevPy !== null && Math.abs(py - prevPy) > g.h * 1.5;
          if (!started || jump) { ctx.moveTo(px, py); started = true; }
          else ctx.lineTo(px, py);
          prevPy = py;
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
        return;
      }
      if (o.kind === 'point' || o.kind === 'inter') {
        const p = ggPointXY(o);
        if (!p) return;
        const pp = g.toPx(p[0], p[1]);
        ctx.beginPath(); ctx.arc(pp[0], pp[1], o.id === ggSelected ? 6 : 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = th.halo; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = th.objLabel;
        ctx.font = '12px ui-monospace, monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText(o.name, pp[0] + 8, pp[1] - 6);
        return;
      }
      if (o.kind === 'line' || o.kind === 'segment' || o.kind === 'tangent') {
        const L = ggLinePts(o);
        if (!L) return;
        ctx.beginPath();
        if (o.kind === 'segment') {
          const a = ggPointXY(ggById(o.p)), b = ggPointXY(ggById(o.q));
          if (!a || !b) return;
          const pa = g.toPx(a[0], a[1]), pb = g.toPx(b[0], b[1]);
          ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]);
        } else if (L.vert) {
          const px = g.toPx(L.x0, 0)[0];
          ctx.moveTo(px, 0); ctx.lineTo(px, g.h);
        } else {
          const y1 = ggLineY(L, g.xMin), y2 = ggLineY(L, g.xMax);
          const p1 = g.toPx(g.xMin, y1), p2 = g.toPx(g.xMax, y2);
          ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
        }
        ctx.stroke();
        return;
      }
      if (o.kind === 'circle') {
        const c = ggPointXY(ggById(o.c));
        if (!c) return;
        const pc = g.toPx(c[0], c[1]);
        ctx.beginPath(); ctx.ellipse(pc[0], pc[1], Math.abs(o.r * plotView.sx), Math.abs(o.r * plotView.sy), 0, 0, Math.PI * 2); ctx.stroke();
        return;
      }
      if (o.kind === 'poly') {
        const pts = ggPolyPoints(o);
        if (pts.length < 3) return;
        ctx.beginPath();
        pts.forEach(function (p, i) {
          const pp = g.toPx(p[0], p[1]);
          if (i === 0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
        });
        ctx.closePath();
        ctx.save();
        ctx.globalAlpha = 0.16; ctx.fill(); ctx.restore();
        ctx.stroke();
        return;
      }
      if (o.kind === 'angle') {
        const A = ggPointXY(ggById(o.a)), B = ggPointXY(ggById(o.b)), C = ggPointXY(ggById(o.c));
        if (!A || !B || !C) return;
        const pb = g.toPx(B[0], B[1]);
        const a1 = Math.atan2(A[1] - B[1], A[0] - B[0]);
        const a2 = Math.atan2(C[1] - B[1], C[0] - B[0]);
        ctx.beginPath();
        /* canvas 的 y 向下，角度取反 */
        ctx.arc(pb[0], pb[1], 22, -a1, -a2, angleSweep(a1, a2));
        ctx.stroke();
        const val = ggMeasure(o);
        ctx.fillStyle = col;
        ctx.font = '12px ui-monospace, monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(fmtNum(val, 5) + (angleMode === 'DEG' ? '°' : ''), pb[0] + 26, pb[1] - 14);
        return;
      }
      if (o.kind === 'number' && o.mtype === 'int') {
        /* 积分区域着色 */
        const f = ggById(o.fn);
        if (!f || !f.ast) return;
        const a = Math.min(o.a, o.b), b = Math.max(o.a, o.b);
        const n = 160;
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= n; i++) {
          const x = a + (b - a) * i / n;
          const y = ggEval(f.ast, x);
          if (!isFinite(y)) continue;
          const pp = g.toPx(x, y);
          if (!started) { const p0 = g.toPx(x, 0); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(pp[0], pp[1]); started = true; }
          else ctx.lineTo(pp[0], pp[1]);
        }
        if (started) { const pe = g.toPx(b, 0); ctx.lineTo(pe[0], pe[1]); ctx.closePath(); }

      }
    }
    function angleSweep(a1, a2) {

      let d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d > 0;
    }

    /* ---------- 命中测试 ---------- */
    function ggNearestPoint(v, tolPx) {
      let best = null, bestD = tolPx;
      ggObjects.forEach(function (o) {
        if (o.kind !== 'point' && o.kind !== 'inter') return;
        if (o.visible === false) return;
        const p = ggPointXY(o);
        if (!p) return;
        const g = plotGeomSafe();
        const pp = g.toPx(p[0], p[1]);
        const vp = g.toPx(v[0], v[1]);
        const d = Math.hypot(pp[0] - vp[0], pp[1] - vp[1]);
        if (d < bestD) { bestD = d; best = p; }
      });
      return best;
    }
    function ggHitTest(px, py) {
      const g = plotGeomSafe();
      if (!g) return null;
      const v = g.toVal(px, py);
      const near = ggNearestPoint(v, 12);
      if (near) {
        for (let i = ggObjects.length - 1; i >= 0; i--) {
          const o = ggObjects[i];
          if ((o.kind === 'point' || o.kind === 'inter') && o.visible !== false) {
            const p = ggPointXY(o);
            if (p && Math.hypot(p[0] - near[0], p[1] - near[1]) < 1e-9) return o;
          }
        }
      }
      for (let i = ggObjects.length - 1; i >= 0; i--) {
        const o = ggObjects[i];
        if (o.visible === false) continue;
        if (o.kind === 'func' && o.ast) {
          const y = ggEval(o.ast, v[0]);
          if (isFinite(y)) {
            const pp = g.toPx(v[0], y);
            if (Math.abs(pp[1] - py) < 7) return o;
          }
          continue;
        }
        if (o.kind === 'circle') {
          const c = ggPointXY(ggById(o.c));
          if (!c) continue;
          const dpx = Math.hypot((v[0] - c[0]) * plotView.sx, (v[1] - c[1]) * plotView.sy);
          if (Math.abs(dpx - o.r * pxScaleAvg()) < 8) return o;
          continue;
        }
        if (o.kind === 'line' || o.kind === 'segment' || o.kind === 'tangent') {
          const L = ggLinePts(o);
          if (!L) continue;
          let d;
          if (o.kind === 'segment') {
            const a = ggPointXY(ggById(o.p)), b = ggPointXY(ggById(o.q));
            if (!a || !b) continue;
            d = distPointSeg(v, a, b);
          } else if (L.vert) {
            d = Math.abs(v[0] - L.x0);
          } else {
            d = Math.abs(L.m * (v[0] - L.px) + L.py - v[1]) / Math.hypot(1, L.m);
          }
          if (d * pxScaleAvg() < 7) return o;
          continue;
        }
        if (o.kind === 'poly') {
          const segs = ggSegsOf(o);
          for (let s = 0; s < segs.length; s++) {
            if (distPointSeg(v, segs[s][0], segs[s][1]) * pxScaleAvg() < 7) return o;
          }
          continue;
        }
      }
      return null;
    }
    function distPointSeg(p, a, b) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const L2 = dx * dx + dy * dy;
      if (L2 < 1e-12) return Math.hypot(p[0] - a[0], p[1] - a[1]);
      let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
    }

    /* ---------- 工具与面板 ---------- */
    const GG_TOOL_IDS = ['move', 'point', 'line', 'segment', 'circle', 'poly', 'intersect', 'distance', 'angle', 'area', 'tangent', 'derivative', 'integral'];
    const GG_TOOL_SVG = {

      derivative: '<path d="M4 18c6 0 6-12 16-12"/><path d="M4 12h16" stroke-dasharray="3 3"/>',

    let ggPane = 'algebra';

    function ggSetTool(name) {

    function ggOpenView() {

    }
    /* 手机端底部弹出面板需配遮罩并隐藏底部导航；桌面侧拉抽屉不需要。
       打开/关闭/旋转屏幕时统一同步这两种状态 */
    function ggSyncViewSheetMode() {
      const d = document.getElementById('ggViewDrawer');
      const sheet = window.matchMedia('(max-width: 760px)').matches && d.classList.contains('open');
      document.getElementById('viewBackdrop').classList.toggle('show', sheet);
      document.body.classList.toggle('gg-view-open', sheet);
    }
    function ggSyncViewInputs() {
      const g = plotGeomSafe();
      if (!g) return;
      document.getElementById('ggViewXMin').value = fmtTick(g.xMin, 0.001);
      document.getElementById('ggViewXMax').value = fmtTick(g.xMax, 0.001);
      document.getElementById('ggViewYMin').value = fmtTick(g.yMin, 0.001);
      document.getElementById('ggViewYMax').value = fmtTick(g.yMax, 0.001);
    }
    function ggApplyViewRange() {
      const g = plotGeomSafe();
      if (!g) return;
      const x0 = parseFloat(document.getElementById('ggViewXMin').value);
      const x1 = parseFloat(document.getElementById('ggViewXMax').value);
      const y0 = parseFloat(document.getElementById('ggViewYMin').value);
      const y1 = parseFloat(document.getElementById('ggViewYMax').value);
      if (![x0, x1, y0, y1].every(isFinite)) return;
      if (x1 - x0 < 1e-9 || y1 - y0 < 1e-9) return;
      plotView.cx = (x0 + x1) / 2;
      plotView.cy = (y0 + y1) / 2;
      plotView.sx = g.w / (x1 - x0);
      plotView.sy = g.h / (y1 - y0);
      drawPlot();
    }
    function ggEqualScale() {
      const g = plotGeomSafe();
      if (!g) return;
      const s = Math.min(plotView.sx, plotView.sy);
      plotView.sx = s; plotView.sy = s;
      drawPlot();
      ggSyncViewInputs();
    }

    /* ---------- 对象样式（颜色 / 线宽） ---------- */
    const GG_SWATCHES = ['#d4af37', '#4fc3f7', '#ff7b6b', '#7ed957', '#c792ea', '#202020'];

    /* ---------- 行内调色板：点对象行的颜色圆点弹出，改单个对象颜色 ---------- */
    let ggColorPop = null;   // 当前打开的调色板元素
    let ggColorTarget = null; // 调色板作用的对象 id
    function ggCloseColorPop() {
      if (ggColorPop) { ggColorPop.remove(); ggColorPop = null; ggColorTarget = null; }
    }
    function ggOpenColorPop(objId, anchor) {
      if (ggColorTarget === objId && ggColorPop) { ggCloseColorPop(); return; }
      ggCloseColorPop();
      const o = ggById(objId);
      if (!o) return;
      ggColorTarget = objId;
      const pop = document.createElement('div');
      pop.className = 'gg-color-pop';
      const colors = GG_SWATCHES.concat([o.color]).filter(function (c, i, a) { return a.indexOf(c) === i; });
      colors.forEach(function (c) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'gg-swatch' + (c === o.color ? ' on' : '');
        b.style.background = c;
        b.title = c;
        b.onclick = function (ev) {
          ev.stopPropagation();
          ggPushHistory();
          o.color = c;
          ggCloseColorPop();
          renderGgList(); drawPlot();
          if (document.getElementById('ggStylebar').classList.contains('open')) ggRenderStylebar();
        };
        pop.appendChild(b);
      });
      document.body.appendChild(pop);
      /* 定位到颜色圆点上方，超出屏幕时回退到下方/收边 */
      const r = anchor.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 8);
      let top = r.top - ph - 8;
      if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      ggColorPop = pop;
    }
    /* 点击弹层以外区域或滚动时收起 */
    document.addEventListener('click', function (ev) {
      if (ggColorPop && !ggColorPop.contains(ev.target) && !ev.target.classList.contains('gg-row-color')) ggCloseColorPop();
    });
    window.addEventListener('scroll', function () { if (ggColorPop) ggCloseColorPop(); }, true);

    /* ---------- 表格视图 ---------- */
    let ggTableRows = 11;
    function ggAddTableRows(n) { ggTableRows += n; ggRenderTable(); }
    function ggRenderTable() {
      const table = document.getElementById('ggTable');
      if (!table) return;
      const funcs = ggObjects.filter(function (o) { return o.kind === 'func' && o.ast && o.visible !== false; });
      const wrap = table.parentElement;
      const oldEmpty = wrap ? wrap.querySelector('.gg-table-empty') : null;
      if (oldEmpty) oldEmpty.remove();
      table.innerHTML = '';
      if (!funcs.length) {
        if (wrap) {
          const d = document.createElement('div');
          d.className = 'gg-table-empty';
          d.innerText = T().ggTableEmpty || 'No functions yet.';
          wrap.appendChild(d);
          wrap.classList.add('is-empty');
        }
        return;
      }
      if (wrap) wrap.classList.remove('is-empty');
      const head = document.createElement('tr');
      const thx = document.createElement('th');
      thx.className = 'xcol';
      thx.innerText = 'x';
      head.appendChild(thx);
      funcs.forEach(function (f) {
        const th = document.createElement('th');
        th.innerText = f.name + '(x)';
        th.style.color = f.color;
        head.appendChild(th);
      });
      table.appendChild(head);
      /* x 值：优先读已存在的输入（保持用户编辑），否则按当前视图取整步长铺开 */
      const g = plotGeomSafe();
      const stx = g ? niceStep(60, plotView.sx) : 1;
      const x0 = g ? Math.ceil(g.xMin / stx) * stx : -5;
      for (let i = 0; i < ggTableRows; i++) {
        const tr = document.createElement('tr');
        const tdx = document.createElement('td');
        tdx.className = 'xcol';
        const xin = document.createElement('input');
        xin.type = 'text';
        xin.value = fmtNum(x0 + i * stx, 6) || '0';
        xin.dataset.i = i;
        xin.oninput = function () { ggUpdateTableRow(tr, funcs); };
        tdx.appendChild(xin);
        tr.appendChild(tdx);
        funcs.forEach(function (f) {
          const td = document.createElement('td');
          td.className = 'val';
          tr.appendChild(td);
        });
        ggUpdateTableRow(tr, funcs);
        table.appendChild(tr);
      }
    }
    function ggUpdateTableRow(tr, funcs) {
      const xin = tr.querySelector('input');
      const xv = parseFloat(xin.value);
      const cells = tr.querySelectorAll('td.val');
      funcs.forEach(function (f, i) {
        if (!cells[i]) return;
        const v = isFinite(xv) ? ggEval(f.ast, xv) : NaN;
        cells[i].innerText = isFinite(v) ? (fmtNum(v, 8) || '—') : '—';
      });
    }

    /* ---------- 屏幕数学键盘 ---------- */
    const GG_KB = {
      num: [
        ['x', 'x'], ['y', 'y'], ['pi', 'π'], ['e', 'e'],
        ['^2', '^2'], ['^', '^'], ['sqrt(', '√('], ['abs(', '| |'],
        ['<', '<'], ['>', '>'], ['<=', '≤'], ['>=', '≥'],
        ['ans', 'ans'], [',', ','], ['(', '('], [')', ')']
      ],
      num2: [
        ['7', '7'], ['8', '8'], ['9', '9'], ['×', '*'], ['÷', '/'],
        ['4', '4'], ['5', '5'], ['6', '6'], ['+', '+'], ['-', '−'],
        ['1', '1'], ['2', '2'], ['3', '3'], ['=', '='], ['⌫', '⌫'],
        ['0', '0'], ['.', '.'], ['%', '%'], ['!', '!'], ['AC', 'AC']
      ],

        ['log(', 'log'], ['sqrt(', '√'], ['cbrt(', '∛'], ['abs(', 'abs'],
        ['floor(', '⌊ ⌋'], ['ceil(', '⌈ ⌉'], ['sinh(', 'sinh'], ['cosh(', 'cosh']
      ],
      abc: [
        ['a', 'a'], ['b', 'b'], ['c', 'c'], ['k', 'k'],
        ['m', 'm'], ['n', 'n'], ['t', 't'], ['u', 'u'],
        ['f', 'f'], ['g', 'g'], ['h', 'h'], ['p', 'p'],
        ['q', 'q'], ['r', 'r'], ['s', 's'], ['w', 'w']
      ],
      sym: [
        ['alpha', 'α'], ['beta', 'β'], ['theta', 'θ'], ['lambda', 'λ'],
        ['mu', 'μ'], ['sigma', 'σ'], ['phi', 'φ'], ['omega', 'ω'],
        ['pi', 'π'], ['tau', 'τ'], ['Delta', 'Δ'], ['Sigma', 'Σ'],
        ['!=', '≠'], ['≈', '~'], ['°', '°'], ['_n', 'ₙ']
