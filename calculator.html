    let ggKbOpen = false;
    let ggKbTabName = 'num';

    function ggToggleKb() {
      ggKbOpen = !ggKbOpen;
      const kb = document.getElementById('ggKb');
      kb.classList.toggle('open', ggKbOpen);
      document.getElementById('side-kb').classList.toggle('active', ggKbOpen);
      const shell = document.querySelector('.gg-shell');
      if (shell) shell.classList.toggle('kb-open', ggKbOpen);
      /* 手机端键盘展开时隐藏底部导航栏（见 CSS body.gg-kb-open） */
      document.body.classList.toggle('gg-kb-open', ggKbOpen);
      if (ggKbOpen) {
        ggRenderKb();
        /* 输入框在代数区：若当前在工具/表格面板，先切回代数区再滚动定位 */
        if (ggPane !== 'algebra') ggSwitchPane('algebra');
        ggSyncKbDock();
      }
    }
    function ggSyncKbDock() {
      const kb = document.getElementById('ggKb');
      const shell = document.querySelector('.gg-shell');
      requestAnimationFrame(function () {
        if (shell && kb) shell.style.setProperty('--kb-h', kb.offsetHeight + 'px');
        /* 键盘展开后把输入框滚到键盘正上方：键盘是 fixed 遮罩层，
           scrollIntoView('nearest') 会误判输入框"已在视口内"而不滚动，
           因此按键盘顶边手动计算滚动量，保证输入内容始终可见 */
        if (ggKbOpen) {
          const inp = document.getElementById('ggInput');
          if (!inp) return;
          const kbTop = kb.getBoundingClientRect().top;
          const r = inp.getBoundingClientRect();
          const target = kbTop - 10;
          if (r.bottom > target || r.top < 0) {
            window.scrollBy({ top: r.bottom - target, behavior: 'smooth' });
          }
        }
      });
    }
    function ggKbTab(name, btn) {
      ggKbTabName = name;
      document.querySelectorAll('.gg-kb-tab').forEach(function (b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      ggRenderKb();
    }
    function ggRenderKb() {
      const grid = document.getElementById('ggKbGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const blocks = ggKbTabName === 'num' ? [['num', GG_KB.num], ['num', GG_KB.num2]] : [[ggKbTabName, GG_KB[ggKbTabName]]];
      blocks.forEach(function (pair) {
        const div = document.createElement('div');
        div.className = 'gg-kb-block' + (pair[0] === 'num' ? ' num' : '');
        pair[1].forEach(function (kv) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'gg-kb-key' + (['ans', '⌫', 'AC'].indexOf(kv[0]) >= 0 ? ' muted' : '');
          b.innerText = kv[1];
          b.onclick = function () { ggKbInsert(kv[0]); };
          div.appendChild(b);
        });
        grid.appendChild(div);
      });
    }
    /* 屏幕键盘打开期间不聚焦输入框：iOS/Android 上 focus 会唤起系统键盘，
       与自带数学键盘叠加非常干扰；此期间用 ggCaret 手动维护光标位置 */
    let ggCaret = 0;
    function ggKbInsert(key) {
      const inp = document.getElementById('ggInput');
      let s, e;
      if (ggKbOpen) {
        ggCaret = Math.min(ggCaret, inp.value.length);
        s = e = ggCaret;
      } else {
        s = inp.selectionStart === null ? inp.value.length : inp.selectionStart;
        e = inp.selectionEnd === null ? inp.value.length : inp.selectionEnd;
      }
      let ins = key;
      let caret = null;
      if (key === '⌫') {
        inp.value = inp.value.slice(0, Math.max(0, s - 1)) + inp.value.slice(e);
        caret = Math.max(0, s - 1);
        if (ggKbOpen) { ggCaret = caret; return; }
        inp.focus();
        inp.setSelectionRange(caret, caret);
        return;
      }
      if (key === 'AC') { inp.value = ''; ggCaret = 0; return; }
      if (key === '=') { ggAddFromInput(); return; }
      if (key === '×') ins = '*';
      if (key === '÷') ins = '/';
      if (key === '−') ins = '-';
      if (key === '≤') ins = '<=';
      if (key === '≥') ins = '>=';
      if (key === '≠') ins = '!=';
      if (key === '~') ins = '~';
      if (key === '_n') ins = '_1';
      inp.value = inp.value.slice(0, s) + ins + inp.value.slice(e);
      caret = s + ins.length;
      if (ggKbOpen) { ggCaret = caret; return; }
      inp.focus();
      inp.setSelectionRange(caret, caret);
    }

    /* ---------- 画布浮动工具栏 ---------- */
    function renderGgToolbar() {
      const bar = document.getElementById('ggToolbar');
      if (!bar) return;
      bar.innerHTML = '';
      const groups = [
        ['move', 'point', 'line', 'segment', 'circle', 'poly'],
        ['intersect', 'distance', 'angle', 'area', 'tangent', 'derivative', 'integral']
      ];
      groups.forEach(function (grp, gi) {
        if (gi) {
          const sep = document.createElement('div');
          sep.className = 'gg-tool-sep';
          bar.appendChild(sep);
        }
        grp.forEach(function (id) {
          const b = document.createElement('button');
          b.type = 'button';
          b.id = 'tool-' + id;
          b.title = (T().ggToolNames[id] || id);
          b.innerHTML = '<svg viewBox="0 0 24 24">' + GG_TOOL_SVG[id] + '</svg>';
          b.onclick = function () { ggSetTool(id); };
          if (ggTool === id) b.classList.add('on');
          bar.appendChild(b);
        });
      });
    }

    function ggFocusInput() {
      const inp = document.getElementById('ggInput');
      /* 屏幕键盘已打开时不聚焦，避免唤起系统键盘；光标停在末尾 */
      if (ggKbOpen) { ggCaret = inp.value.length; return; }
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }

    function ggToggleOpt(key) {
      ggOpts[key] = !ggOpts[key];
      const map = { grid: 'ggOptGrid', minor: 'ggOptMinor', axes: 'ggOptAxes', labels: 'ggOptLabels', snap: 'ggOptSnap' };
      document.getElementById(map[key]).checked = ggOpts[key];
      drawPlot();
    }

    function ggAddPoint(x, y, visible) {
      const o = { id: 'o' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), kind: 'point', name: ggNextName('point'), x: x, y: y, color: ggColor(), visible: visible !== false };
      ggObjects.push(o);
      return o;
    }

    function ggToolClick(v, px, py) {
      const snap = ggSnapVal(v);
      if (ggTool === 'move') {
        const hit = ggHitTest(px, py);
        ggSelected = hit ? hit.id : null;
        renderGgList(); drawPlot();
        return;
      }
      if (ggTool === 'point') {
        ggPushHistory();
        ggAddPoint(snap[0], snap[1], true);
        afterChange();
        return;
      }
      if (ggTool === 'line' || ggTool === 'segment') {
        const hit = ggHitTest(px, py);
        const pt = (hit && (hit.kind === 'point' || hit.kind === 'inter')) ? hit : ggAddPoint(snap[0], snap[1], true);
        ggPending.push(pt);
        if (ggPending.length === 2) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            kind: ggTool, name: ggNextName(ggTool), p: ggPending[0].id, q: ggPending[1].id,
            color: ggColor(), visible: true
          });
          ggPending = [];
          afterChange();
        } else drawPlot();
        return;
      }
      if (ggTool === 'circle') {
        const hit = ggHitTest(px, py);
        const pt = (hit && (hit.kind === 'point' || hit.kind === 'inter')) ? hit : ggAddPoint(snap[0], snap[1], true);
        ggPending.push(pt);
        if (ggPending.length === 2) {
          const a = ggPointXY(ggPending[0]), b = ggPointXY(ggPending[1]);
          if (a && b) {
            ggPushHistory();
            ggObjects.push({
              id: 'o' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
              kind: 'circle', name: ggNextName('circle'), c: ggPending[0].id,
              r: Math.hypot(b[0] - a[0], b[1] - a[1]), color: ggColor(), visible: true
            });
          }
          ggPending = [];
          afterChange();
        } else drawPlot();
        return;
      }
      if (ggTool === 'poly') {
        const hit = ggHitTest(px, py);
        if (ggDraftPoly && ggDraftPoly.length >= 3) {
          const first = ggPointXY(ggById(ggDraftPoly[0]));
          if (first) {
            const g = plotGeomSafe();
            const fp = g.toPx(first[0], first[1]);
            if (Math.hypot(fp[0] - px, fp[1] - py) < 12) { ggFinishPoly(); return; }
          }
        }
        const pt = (hit && (hit.kind === 'point' || hit.kind === 'inter')) ? hit : ggAddPoint(snap[0], snap[1], true);
        if (!ggDraftPoly) ggDraftPoly = [];
        ggDraftPoly.push(pt.id);
        renderGgList(); drawPlot();
        return;
      }
      if (ggTool === 'intersect') {
        const hit = ggHitTest(px, py);
        if (!hit) return;
        ggPending.push(hit);
        if (ggPending.length === 2) {
          const pts = ggIntersections(ggPending[0], ggPending[1]);
          if (pts.length) {
            ggPushHistory();
            pts.forEach(function (p, i) {
              ggObjects.push({
                id: 'o' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 7),
                kind: 'inter', name: ggNextName('inter'), src: [ggPending[0].id, ggPending[1].id], idx: i,
                color: '#ffffff', visible: true
              });
            });
          } else {
            ggWarn(T().ggWarnNoInter || 'No intersection between these objects.');
          }
          ggPending = [];
          afterChange();
        }
        return;
      }
      if (ggTool === 'distance') {
        const hit = ggHitTest(px, py);
        if (hit && (hit.kind === 'segment' || hit.kind === 'circle' || hit.kind === 'poly')) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_m', kind: 'number', name: ggNextName('number'),
            mtype: 'len', target: hit.id, label: 'len(' + hit.name + ')', value: 0, color: ggColor(), visible: true
          });
          afterChange();
          return;
        }
        const pt = (hit && (hit.kind === 'point' || hit.kind === 'inter')) ? hit : ggAddPoint(snap[0], snap[1], true);
        ggPending.push(pt);
        if (ggPending.length === 2) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_m', kind: 'number', name: ggNextName('number'),
            mtype: 'dist', a: ggPending[0].id, b: ggPending[1].id,
            label: 'dist(' + ggPending[0].name + ',' + ggPending[1].name + ')', value: 0, color: ggColor(), visible: true
          });
          ggPending = [];
          afterChange();
        }
        return;
      }
      if (ggTool === 'angle') {
        const hit = ggHitTest(px, py);
        const pt = (hit && (hit.kind === 'point' || hit.kind === 'inter')) ? hit : ggAddPoint(snap[0], snap[1], true);
        ggPending.push(pt);
        if (ggPending.length === 3) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_a', kind: 'angle', name: ggNextName('angle'),
            a: ggPending[0].id, b: ggPending[1].id, c: ggPending[2].id, color: ggColor(), visible: true
          });
          ggPending = [];
          afterChange();
        }
        return;
      }
      if (ggTool === 'area') {
        const hit = ggHitTest(px, py);
        if (hit && (hit.kind === 'poly' || hit.kind === 'circle')) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_ar', kind: 'number', name: ggNextName('number'),
            mtype: 'area', target: hit.id, label: 'area(' + hit.name + ')', value: 0, color: ggColor(), visible: true
          });
          afterChange();
        }
        return;
      }
      if (ggTool === 'tangent') {
        const hit = ggHitTest(px, py);
        if (!hit) return;
        ggPending.push(hit);
        if (ggPending.length === 2) {
          const pt = ggPending[0].kind === 'point' || ggPending[0].kind === 'inter' ? ggPending[0] : null;
          const fn = ggPending[1].kind === 'func' ? ggPending[1] : (ggPending[0].kind === 'func' ? ggPending[0] : null);
          if (pt && fn) {
            ggPushHistory();
            ggObjects.push({
              id: 'o' + Date.now() + '_t', kind: 'tangent', name: ggNextName('tangent'),
              pt: pt.id, fn: fn.id, color: ggColor(), visible: true
            });
          } else {
            ggWarn(T().ggWarnTangent || 'Pick one point, then a function curve.');
          }
          ggPending = [];
          afterChange();
        }
        return;
      }
      if (ggTool === 'derivative') {
        let fn = ggHitTest(px, py);
        if (!fn || fn.kind !== 'func') fn = ggObjects.filter(function (o) { return o.kind === 'func'; }).pop();
        if (fn) {
          ggPushHistory();
          const o = {
            id: 'o' + Date.now() + '_d', kind: 'func', name: ggNextName('func'),
            def: '', color: ggColor(), visible: true, derivOf: fn.id
          };
          o.def = fn.name + "'(x)";
          o.ast = fn.ast ? { type: 'deriv', a: fn.ast } : null;
          ggObjects.push(o);
          afterChange();
        } else {
          ggWarn(T().ggWarnFunc || 'No function curve yet. Create one first, e.g. sin(x).');
        }
        return;
      }
      if (ggTool === 'integral') {
        if (ggPending.length === 0) {
          const hit = ggHitTest(px, py);
          if (hit && hit.kind === 'func') { ggPending = [hit]; drawPlot(); }
          else ggWarn(T().ggWarnFunc || 'No function curve yet. Create one first, e.g. sin(x).');
          return;
        }
        if (ggPending.length === 1) {
          ggPending.push(snap[0]);
          drawPlot();
          return;
        }
        if (ggPending.length === 2) {
          ggPushHistory();
          ggObjects.push({
            id: 'o' + Date.now() + '_i', kind: 'number', name: ggNextName('number'),
            mtype: 'int', fn: ggPending[0].id, a: ggPending[1], b: snap[0],
            label: '∫ ' + ggPending[0].name, value: 0, color: ggColor(), visible: true
          });
          ggPending = [];
          afterChange();
        }
        return;
      }
    }
    /* 工具操作不满足条件时的可见反馈（替代静默无反应） */
    let ggWarnTimer = null;
    function ggWarn(msg) {
      const step = document.getElementById('ggStepbar');
      if (!step) return;
      step.classList.add('show');
      step.innerHTML = '<b>!</b> ' + msg;
      if (ggWarnTimer) clearTimeout(ggWarnTimer);
      ggWarnTimer = setTimeout(function () { ggWarnTimer = null; ggUpdateStatus(); }, 2600);
    }

    function ggFinishPoly() {
      if (!ggDraftPoly || ggDraftPoly.length < 3) { ggDraftPoly = null; return; }
      ggPushHistory();
      ggObjects.push({
        id: 'o' + Date.now() + '_w', kind: 'poly', name: ggNextName('poly'),
        pts: ggDraftPoly.slice(), color: ggColor(), visible: true
      });
      ggDraftPoly = null;
      afterChange();
    }
    function afterChange() {
      renderGgList(); updateGgCalc(); drawPlot(); ggSyncUndoBtns();
    }

    /* ---------- 代数区列表 ---------- */
    function ggDefText(o) {
      if (o.kind === 'func') return o.name + '(x) = ' + o.def;
      if (o.kind === 'point' || o.kind === 'inter') {
        const p = ggPointXY(o);
        return o.name + ' = ' + (p ? '(' + fmtNum(p[0], 5) + ', ' + fmtNum(p[1], 5) + ')' : '—');
      }
      if (o.kind === 'line' || o.kind === 'segment') {
        const a = ggById(o.p), b = ggById(o.q);
        return o.name + ' = ' + (a ? a.name : '?') + (o.kind === 'line' ? ' → ' : ' — ') + (b ? b.name : '?');
      }
      if (o.kind === 'tangent') {
        const f = ggById(o.fn), p = ggById(o.pt);
        return o.name + ': tangent(' + (f ? f.name : '?') + ', ' + (p ? p.name : '?') + ')';
      }
      if (o.kind === 'circle') {
        const c = ggById(o.c);
        return o.name + ': circle(' + (c ? c.name : '?') + ', r=' + fmtNum(o.r, 5) + ')';
      }
      if (o.kind === 'poly') return o.name + ': polygon(' + o.pts.length + ')';
      if (o.kind === 'angle') return o.name + ' = ' + (fmtNum(ggMeasure(o), 5) || '—') + (angleMode === 'DEG' ? '°' : ' rad');
      if (o.kind === 'number') return o.name + ' = ' + (fmtNum(ggMeasure(o), 8) || '—');
      return o.name;
    }

    function renderGgList() {
      const box = document.getElementById('ggList');
      if (!box) return;
      box.innerHTML = '';
      if (!ggObjects.length) {
        const empty = document.createElement('div');
        empty.className = 'gg-empty';
        empty.innerText = T().ggEmptyList;
        box.appendChild(empty);
        return;
      }
      ggObjects.forEach(function (o) {
        const row = document.createElement('div');
        row.className = 'gg-row' + (o.id === ggSelected ? ' sel' : '') + (o.visible === false ? ' hidden-obj' : '');

        const main = document.createElement('div');
        main.className = 'gg-row-main';

        const sw = document.createElement('span');
        sw.className = 'gg-row-icon';
        sw.style.background = (o.kind === 'point' || o.kind === 'inter') ? o.color : 'transparent';
        sw.style.border = '2px solid ' + o.color;
        sw.style.borderRadius = (o.kind === 'point' || o.kind === 'inter') ? '50%' : '3px';
        main.appendChild(sw);

        const def = document.createElement('span');
        def.className = 'gg-row-def';
        def.innerText = ggDefText(o);
        def.title = ggDefText(o);
        def.onclick = function () { ggSelected = o.id; renderGgList(); drawPlot(); };
        main.appendChild(def);

        const tools = document.createElement('span');
        tools.className = 'gg-row-tools';
        const mkBtn = function (txt, title, fn) {
          const b = document.createElement('button');
          b.type = 'button'; b.innerText = txt; b.title = title;
          b.onclick = function (ev) { ev.stopPropagation(); fn(); };
          return b;
        };
        if (o.kind === 'func') {
          tools.appendChild(mkBtn('✎', T().ggEdit, function () { ggEditFunc(o); }));
        }
        /* 颜色圆点：显示对象当前颜色，点击弹出行内调色板自定义 */
        const cbtn = document.createElement('button');
        cbtn.type = 'button';
        cbtn.className = 'gg-row-color';
        cbtn.style.background = o.color;
        cbtn.title = T().ggColor;
        cbtn.onclick = function (ev) { ev.stopPropagation(); ggOpenColorPop(o.id, cbtn); };
        tools.appendChild(cbtn);
        tools.appendChild(mkBtn(o.visible === false ? '○' : '●', T().ggShowHide, function () {
          ggPushHistory();
          o.visible = o.visible === false;
          afterChange();
        }));
        tools.appendChild(mkBtn('✕', T().ggDelete, function () {
          ggPushHistory();
          ggDeleteObject(o.id);
          afterChange();
        }));
        main.appendChild(tools);
        row.appendChild(main);

        /* 数值对象（含常量）显示滑杆，可像 GeoGebra 一样拖动联动 */
        if (o.kind === 'number' && o.mtype !== 'dist' && o.mtype !== 'len' && o.mtype !== 'area' && o.mtype !== 'int') {
          const srow = document.createElement('div');
          srow.className = 'gg-slider-row';
          const range = document.createElement('input');
          range.type = 'range';
          range.min = o.min === undefined ? -10 : o.min;
          range.max = o.max === undefined ? 10 : o.max;
          range.step = 0.1;
          range.value = o.value;
          const val = document.createElement('span');
          val.className = 'gg-slider-val';
          val.innerText = fmtNum(o.value, 5) || '0';
          range.oninput = function () {
            o.value = parseFloat(range.value);
            val.innerText = fmtNum(o.value, 5) || '0';
            recompileFuncs();
            drawPlot(); updateGgCalc();
          };
          range.onchange = function () { renderGgList(); };
          srow.appendChild(range);
          srow.appendChild(val);
          row.appendChild(srow);
        }
        box.appendChild(row);
      });
    }

    function ggDeleteObject(id) {
      /* 删除依赖它的对象 */
      const dependents = ggObjects.filter(function (o) {
        if (o.id === id) return true;
        const refs = [o.p, o.q, o.c, o.fn, o.pt, o.a, o.b, o.target].filter(Boolean);
        if (refs.indexOf(id) >= 0) return true;
        if (o.pts && o.pts.indexOf(id) >= 0) return true;
        if (o.src && o.src.indexOf(id) >= 0) return true;
        return false;
      });
      const ids = dependents.map(function (o) { return o.id; });
      /* 递归一层：再找依赖这些的 */
      let changed = true;
      while (changed) {
        changed = false;
        ggObjects.forEach(function (o) {
          if (ids.indexOf(o.id) >= 0) return;
          const refs = [o.p, o.q, o.c, o.fn, o.pt, o.a, o.b, o.target].filter(Boolean);
          const hit = refs.some(function (r) { return ids.indexOf(r) >= 0; }) ||
            (o.pts && o.pts.some(function (r) { return ids.indexOf(r) >= 0; })) ||
            (o.src && o.src.some(function (r) { return ids.indexOf(r) >= 0; }));
          if (hit) { ids.push(o.id); changed = true; }
        });
      }
      ggObjects = ggObjects.filter(function (o) { return ids.indexOf(o.id) < 0; });
      if (ids.indexOf(ggSelected) >= 0) ggSelected = null;
    }

    function ggEditFunc(o) {
      /* 行内编辑需要真焦点：若屏幕键盘开着先收起，避免焦点与系统键盘错乱 */
      if (ggKbOpen) ggToggleKb();
      const row = document.querySelector('.gg-row.sel') || null;
      const list = document.getElementById('ggList');
      const rows = list.querySelectorAll('.gg-row');
      const idx = ggObjects.indexOf(o);
      const target = rows[idx];
      if (!target) return;
      const defEl = target.querySelector('.gg-row-def');
      if (!defEl) return;
      const inp = document.createElement('input');
      inp.className = 'gg-row-def-input';
      inp.value = o.def;
      inp.spellcheck = false;
      defEl.replaceWith(inp);
      inp.focus();
      inp.select();
      const commit = function () {
        const nv = inp.value.trim();
        if (nv && nv !== o.def) {
          const ast = ggCompileFunc(nv);
          if (ast) { ggPushHistory(); o.def = nv; o.ast = ast; }
        }
        recompileFuncs();
        afterChange();
      };
      inp.onkeydown = function (ev) {
        if (ev.key === 'Enter') commit();
        if (ev.key === 'Escape') afterChange();
      };
      inp.onblur = commit;
    }

    function recompileFuncs() {
      ggObjects.forEach(function (o) {
        if (o.kind === 'func' && !o.derivOf) o.ast = ggCompileFunc(o.def);
        if (o.kind === 'func' && o.derivOf) {
          const src = ggById(o.derivOf);
          o.ast = src && src.ast ? { type: 'deriv', a: src.ast } : null;
        }
      });
    }

    /* ---------- 输入栏解析 ---------- */
    function ggAddFromInput() {
      const inp = document.getElementById('ggInput');
      const raw = inp.value.trim();
      if (!raw) return;
      let def = raw;
      let name = null;
      const m = raw.match(/^([a-zA-Zα-ωΑ-Ω][a-zA-Z0-9]*)\s*(?:\(\s*x\s*\))?\s*=\s*(.+)$/);
      if (m) { name = m[1]; def = m[2].trim(); }
      /* 点：(1, 2) 或 A = (1, 2) */
      const pm = def.match(/^\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)$/);
      if (pm) {
        ggPushHistory();
        const o = ggAddPoint(parseFloat(pm[1]), parseFloat(pm[2]), true);
        if (name) o.name = name;
        inp.value = '';
        ggCaret = 0;
        afterChange();
        return;
      }
      const hasX = /(^|[^a-zA-Z])x([^a-zA-Z]|$)/.test(def) || /\bx\b/.test(def);
      if (hasX) {
        const ast = ggCompileFunc(def);
        if (!ast) { ggFlashInvalid(inp); return; }
        ggPushHistory();
        ggObjects.push({
          id: 'o' + Date.now() + '_f', kind: 'func', name: name || ggNextName('func'),
          def: def, ast: ast, color: ggColor(), visible: true
        });
      } else {
        let val;
        try { val = evalAST(compile(def, ggVarNames()), ggVars(0)); } catch (e) { val = NaN; }
        if (!isFinite(val)) { ggFlashInvalid(inp); return; }
        ggPushHistory();
        ggObjects.push({
          id: 'o' + Date.now() + '_n', kind: 'number', name: name || ggNextName('number'),
          mtype: 'const', value: val, min: -20, max: 20, color: ggColor(), visible: true, def: def
        });
      }
      inp.value = '';
      ggCaret = 0;
      afterChange();
    }
    function ggFlashInvalid(inp) {
      inp.style.borderColor = cssVar('--danger') || '#ff6b5e';
      setTimeout(function () { inp.style.borderColor = ''; }, 900);
    }

    function renderPresets() {
      const presets = ['sin(x)', 'cos(x)', 'x^2', 'x^3-3x', 'sqrt(x)', 'sin(x)/x', 'e^x', 'log(x)', 'tan(x)', 'x^2/4-2'];
      ['plotPresets', 'plotPresetsKb'].forEach(function (boxId) {
        const box = document.getElementById(boxId);
        if (!box) return;
        box.innerHTML = '';
        presets.forEach(function (p) {
          const chip = document.createElement('button');
          chip.className = 'preset-chip';
          chip.type = 'button';
          chip.innerText = p;
          chip.onclick = function () {
            document.getElementById('ggInput').value = p;
            ggAddFromInput();
          };
          box.appendChild(chip);
        });
      });
    }

    /* ---------- 测量面板 / 状态栏 ---------- */
    function updateGgCalc() {
      const box = document.getElementById('ggCalc');
      if (!box) return;
      const measures = ggObjects.filter(function (o) {
        return o.kind === 'angle' || (o.kind === 'number' && o.mtype !== 'const');
      });
      if (!measures.length) {
        box.hidden = true;
        box.innerHTML = '';
        return;
      }
      box.hidden = false;
      box.innerHTML = '';
      measures.forEach(function (o) {
        const row = document.createElement('div');
        row.className = 'gg-calc-row';
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.innerText = o.name + ' =';
        const val = document.createElement('span');
        val.className = 'val';
        const v = ggMeasure(o);
        const unit = o.kind === 'angle' ? (angleMode === 'DEG' ? '°' : ' rad') : '';
        val.innerText = (fmtNum(v, 8) || '—') + unit;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerText = T().copy;
        btn.onclick = function () {
          const txt = fmtNum(v, 10) || '';
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
          else legacyCopy(txt, function () {});
        };
        row.appendChild(lbl); row.appendChild(val); row.appendChild(btn);
        box.appendChild(row);
      });
    }

    function ggUpdateStatus() {
      const bar = document.getElementById('ggStatusbar');
      if (!bar) return;
      const g = plotGeomSafe();
      let txt = '';
      if (plotHover && g) {
        const v = g.toVal(plotHover.x, plotHover.y);
        txt = 'x = ' + (fmtNum(v[0], 6) || v[0]) + '   y = ' + (fmtNum(v[1], 6) || v[1]);
      }
      const hint = T().ggToolHints ? (T().ggToolHints[ggTool] || '') : '';
      const pend = ggPending.length ? '  [' + ggPending.length + '/·]' : (ggDraftPoly ? '  [' + ggDraftPoly.length + ']' : '');
      bar.innerHTML = '<span>' + txt + '</span><span><b>' + (T().ggToolNames ? T().ggToolNames[ggTool] : ggTool) + '</b> ' + hint + pend + '</span>';
      /* 画布顶部步骤提示条：手机状态栏隐藏时的主要反馈 */
      const step = document.getElementById('ggStepbar');
      if (step) {
        const active = ggTool !== 'move';
        const cnt = ggDraftPoly ? ggDraftPoly.length : ggPending.length;
        step.classList.toggle('show', active);
        if (active) {
          step.innerHTML = '<b>' + (T().ggToolNames ? T().ggToolNames[ggTool] : ggTool) + '</b> ' +
            (hint || '') + (cnt ? '  [' + cnt + ']' : '');
        }
      }
    }

    /* ---------- 事件 ---------- */
    function canvasPos(ev) {
      const r = ev.target.getBoundingClientRect();
      return [ev.clientX - r.left, ev.clientY - r.top];
    }
    let ggDragPoint = null;

    function bindPlotEvents() {
      const canvas = document.getElementById('plotCanvas');

      canvas.addEventListener('wheel', function (ev) {
        ev.preventDefault();
        const p = canvasPos(ev);
        zoomPlot(ev.deltaY < 0 ? 1.15 : 1 / 1.15, p[0], p[1]);
      }, { passive: false });

      canvas.addEventListener('mousedown', function (ev) {
        const p = canvasPos(ev);
        const g = plotGeomSafe();
        if (!g) return;
        const v = g.toVal(p[0], p[1]);
        if (ggTool === 'move') {
          const near = ggNearestPoint(v, 12);
          if (near) {
            /* 拖动点对象 */
            const obj = ggObjects.filter(function (o) {
              if (o.kind !== 'point') return false;
              const q = ggPointXY(o);
              return q && Math.hypot(q[0] - near[0], q[1] - near[1]) < 1e-9;
            })[0];
            if (obj) {
              ggPushHistory();
              ggDragPoint = obj;
              ggSelected = obj.id;
              renderGgList();
              return;
            }
          }
          plotDrag = { px: p[0], py: p[1], cx: plotView.cx, cy: plotView.cy };
          canvas.classList.add('panning');
        }
      });
      window.addEventListener('mouseup', function () {
        if (ggDragPoint) { ggDragPoint = null; renderGgList(); updateGgCalc(); }
        plotDrag = null;
        canvas.classList.remove('panning');
      });
      canvas.addEventListener('mousemove', function (ev) {
        const p = canvasPos(ev);
        const g = plotGeomSafe();
        if (!g) return;
        if (ggDragPoint) {
          const v = ggSnapVal(g.toVal(p[0], p[1]));
          ggDragPoint.x = v[0]; ggDragPoint.y = v[1];
          plotHover = { x: p[0], y: p[1] };
          drawPlot(); updateGgCalc();
          return;
        }
        if (plotDrag && ggTool === 'move') {
          plotView.cx = plotDrag.cx - (p[0] - plotDrag.px) / plotView.sx;
          plotView.cy = plotDrag.cy + (p[1] - plotDrag.py) / plotView.sy;
        }
        plotHover = { x: p[0], y: p[1] };
        drawPlot();
      });
      canvas.addEventListener('mouseleave', function () {
        plotHover = null;
        if (!plotDrag && !ggDragPoint) drawPlot();
      });
      canvas.addEventListener('click', function (ev) {
        const p = canvasPos(ev);
        const g = plotGeomSafe();
        if (!g) return;
        ggToolClick(g.toVal(p[0], p[1]), p[0], p[1]);
      });
      canvas.addEventListener('dblclick', function (ev) {
        if (ggTool === 'poly' && ggDraftPoly && ggDraftPoly.length >= 3) {
          /* 去掉 dblclick 前 click 多加的顶点 */
          ggDraftPoly.pop();
          ggFinishPoly();
        }
      });

      /* 触摸：单指平移/作图点击，双指缩放 */
      let touchMoved = false;
      canvas.addEventListener('touchstart', function (ev) {
        touchMoved = false;
        if (ev.touches.length === 1) {
          const t = ev.touches[0];
          const r = canvas.getBoundingClientRect();
          plotDrag = { px: t.clientX - r.left, py: t.clientY - r.top, cx: plotView.cx, cy: plotView.cy };
        } else if (ev.touches.length === 2) {
          plotDrag = null;
          const d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
          const r = canvas.getBoundingClientRect();
          pinch = {
            dist: d, sx: plotView.sx, sy: plotView.sy,
            ax: (ev.touches[0].clientX + ev.touches[1].clientX) / 2 - r.left,
            ay: (ev.touches[0].clientY + ev.touches[1].clientY) / 2 - r.top
          };
        }
        ev.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchmove', function (ev) {
        touchMoved = true;
        if (ev.touches.length === 1 && plotDrag) {
          const t = ev.touches[0];
          const r = canvas.getBoundingClientRect();
          const px = t.clientX - r.left, py = t.clientY - r.top;
          plotView.cx = plotDrag.cx - (px - plotDrag.px) / plotView.sx;
          plotView.cy = plotDrag.cy + (py - plotDrag.py) / plotView.sy;
          drawPlot();
        } else if (ev.touches.length === 2 && pinch) {
          const d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
          if (pinch.dist > 0) {
            const before = plotGeom().toVal(pinch.ax, pinch.ay);
            plotView.sx = Math.max(0.0005, Math.min(2e7, pinch.sx * (d / pinch.dist)));
            plotView.sy = Math.max(0.0005, Math.min(2e7, pinch.sy * (d / pinch.dist)));
            const after = plotGeom().toVal(pinch.ax, pinch.ay);
            plotView.cx += before[0] - after[0];
            plotView.cy += before[1] - after[1];
            drawPlot();
          }
        }
        ev.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchend', function (ev) {
        if (!touchMoved && ev.changedTouches.length === 1 && ggTool !== 'move') {
          const t = ev.changedTouches[0];
          const r = canvas.getBoundingClientRect();
          const px = t.clientX - r.left, py = t.clientY - r.top;
          const g = plotGeomSafe();
          if (g) ggToolClick(g.toVal(px, py), px, py);
        }
        plotDrag = null; pinch = null;
        drawPlot();
      });

      document.getElementById('ggInput').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); ggAddFromInput(); }
      });
    }

    /* ================= SECTION: convert ================= */
    /* 每类单位统一换算到 base；温度/角度需函数式换算的用 toBase/fromBase 标注 */
    const UNIT_DATA = {
      length: {
        base: 'm',
        units: {
          'nm': 1e-9, 'μm': 1e-6, 'mm': 0.001, 'cm': 0.01, 'm': 1, 'km': 1000,
          'in': 0.0254, 'ft': 0.3048, 'yd': 0.9144, 'mi': 1609.344, 'nmi': 1852,
          '里': 500, '丈': 10 / 3, '尺': 1 / 3, '寸': 1 / 30
        }
      },
      weight: {
        base: 'kg',
        units: {
          'mg': 1e-6, 'g': 0.001, 'kg': 1, 't': 1000,
          'gr': 6.479891e-5, 'oz': 0.028349523125, 'lb': 0.45359237, 'st': 6.35029318,
          '斤': 0.5, '两': 0.05, '钱': 0.005
        }
      },
      temperature: {
        base: '°C',
        list: ['°C', '°F', 'K', '°R'],
        toBase: function (u, v) {
          if (u === '°C') return v;
          if (u === '°F') return (v - 32) * 5 / 9;
          if (u === 'K') return v - 273.15;
          return (v - 491.67) * 5 / 9;
        },
        fromBase: function (u, v) {
          if (u === '°C') return v;
          if (u === '°F') return v * 9 / 5 + 32;
          if (u === 'K') return v + 273.15;
          return (v + 273.15) * 9 / 5;
        }
      },
      area: {
        base: 'm²',
        units: {
          'mm²': 1e-6, 'cm²': 1e-4, 'm²': 1, 'ha': 1e4, 'km²': 1e6,
          'in²': 0.00064516, 'ft²': 0.09290304, 'yd²': 0.83612736, 'ac': 4046.8564224, '亩': 2000 / 3
        }
      },
      volume: {
        base: 'L',
        units: {
          'mL': 0.001, 'cm³': 0.001, 'L': 1, 'm³': 1000,
          'tsp': 0.00492892159, 'tbsp': 0.0147867648, 'fl oz': 0.0295735296, 'cup': 0.2365882365,
          'pt': 0.473176473, 'qt': 0.946352946, 'gal(US)': 3.785411784, 'gal(UK)': 4.54609
        }
      },
      speed: {
        base: 'm/s',
        units: { 'm/s': 1, 'km/h': 1 / 3.6, 'mph': 0.44704, 'ft/s': 0.3048, 'kn': 0.514444444, 'Ma': 340.29 }
      },
      time: {
        base: 's',
        units: {
          'ms': 0.001, 's': 1, 'min': 60, 'h': 3600,
          'day': 86400, 'week': 604800, 'month(30d)': 2592000, 'year(365d)': 31536000
        }
      },
      energy: {
        base: 'J',
        units: {
          'J': 1, 'kJ': 1000, 'MJ': 1e6, 'cal': 4.184, 'kcal': 4184,
          'Wh': 3600, 'kWh': 3.6e6, 'BTU': 1055.05585, 'ft·lb': 1.35581795, 'eV': 1.602176634e-19
        }
      },
      power: {
        base: 'W',
        units: { 'mW': 0.001, 'W': 1, 'kW': 1000, 'MW': 1e6, 'hp': 745.699872, 'BTU/h': 0.29307107, 'kcal/h': 1.163 }
      },
      pressure: {
        base: 'Pa',
        units: {
          'Pa': 1, 'hPa': 100, 'kPa': 1000, 'MPa': 1e6, 'bar': 1e5,
          'atm': 101325, 'mmHg': 133.322387415, 'inHg': 3386.389, 'psi': 6894.757293
        }
      },
      angle: {
        base: 'deg',
        units: { 'deg': 1, 'rad': 180 / Math.PI, 'grad': 0.9, 'turn': 360, "arcmin": 1 / 60, "arcsec": 1 / 3600 }
      },
      data: {
        base: 'B', binary: true,
        units: { 'bit': 0.125, 'B': 1, 'KB': 1024, 'MB': Math.pow(1024, 2), 'GB': Math.pow(1024, 3), 'TB': Math.pow(1024, 4), 'PB': Math.pow(1024, 5) }
      },
      currency: {
        base: 'USD', dynamic: true,
        list: ['USD', 'CNY', 'EUR', 'JPY', 'GBP', 'HKD', 'KRW', 'AUD', 'CAD', 'SGD', 'CHF', 'NZD', 'THB', 'MYR', 'INR', 'RUB'],
        /* 内置参考汇率（USD 基准），仅在实时获取失败时使用 */
        fallback: {
          USD: 1, CNY: 7.24, EUR: 0.92, JPY: 147.3, GBP: 0.79, HKD: 7.81,
          KRW: 1338, AUD: 1.52, CAD: 1.36, SGD: 1.34, CHF: 0.89, NZD: 1.65,
          THB: 35.6, MYR: 4.45, INR: 83.4, RUB: 92.5
        },
        rates: null, live: false, source: '', when: ''
      }
    };

    let currentConvCat = 'length';
    let ratesTried = false;
    const QUICK_AMOUNTS = [1, 10, 100, 1000];

    function unitList(cat) {
      const d = UNIT_DATA[cat];
      if (d.list) return d.list.slice();
      return Object.keys(d.units);
    }

    function rateOf(cat, unit) {
      const d = UNIT_DATA[cat];
      if (cat === 'currency') {
        /* 汇率表按“1 美元 = N 外币”记录（与公开接口口径一致），
           取倒数换成全局统一口径“1 单位 = N 基准单位” */
        const perUsd = (d.rates && d.rates[unit]) || d.fallback[unit];
        return perUsd ? 1 / perUsd : undefined;
      }
      return d.units[unit];
    }

    function convOne(v, fromUnit, toUnit, cat) {
      const d = UNIT_DATA[cat];
      if (d.toBase) return d.fromBase(toUnit, d.toBase(fromUnit, v));
      const rf = rateOf(cat, fromUnit), rt = rateOf(cat, toUnit);
      if (!rf || !rt) return NaN;
      return v * rf / rt;
    }

    function renderConvCategories() {
      const box = document.getElementById('convCategories');
      box.innerHTML = '';
      Object.keys(UNIT_DATA).forEach(function (cat) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'conv-chip' + (cat === currentConvCat ? ' active' : '');
        chip.innerText = T().convCats[cat] || cat;
        chip.onclick = function () {
          currentConvCat = cat;
          renderConvCategories();
          renderConvUnits();
          renderQuick();
          convert(true);
          document.getElementById('curBar').hidden = cat !== 'currency';
          /* 首次切到货币时才拉取实时汇率，避免无谓请求 */
          if (cat === 'currency' && !ratesTried) {
            ratesTried = true;
            loadLiveRates(false);
          }
        };
        box.appendChild(chip);
      });
      /* 单行滑动布局下，把选中的芯片滚进可视区 */
      const act = box.querySelector('.conv-chip.active');
      if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      convCatSyncArrows();
    }

    /* 桌面端分类栏左右箭头：按可视宽度 80% 步进滚动，并同步两端可用状态 */
    function convCatScroll(dir) {
      const box = document.getElementById('convCategories');
      if (!box) return;
      box.scrollBy({ left: dir * box.clientWidth * 0.8, behavior: 'smooth' });
    }
    function convCatSyncArrows() {
      const box = document.getElementById('convCategories');
      const left = document.getElementById('convCatLeft');
      const right = document.getElementById('convCatRight');
      if (!box || !left || !right) return;
      /* 面板隐藏时宽度为 0，此时任何溢出判断都不可靠，跳过以免误禁用箭头 */
      if (!box.clientWidth) return;
      const overflow = box.scrollWidth > box.clientWidth + 1;
      const atStart = box.scrollLeft <= 1;
      const atEnd = box.scrollLeft + box.clientWidth >= box.scrollWidth - 1;
      left.classList.toggle('off', !overflow || atStart);
      right.classList.toggle('off', !overflow || atEnd);
    }

    function renderConvUnits() {
      const units = unitList(currentConvCat);
      const fromSel = document.getElementById('convFromUnit');
      const toSel = document.getElementById('convToUnit');
      const prevFrom = fromSel.value, prevTo = toSel.value;
      fromSel.innerHTML = ''; toSel.innerHTML = '';
      units.forEach(function (u) {
        fromSel.options.add(new Option(u, u));
        toSel.options.add(new Option(u, u));
      });
      /* 切类时尽量保留同名单位，否则取前两个 */
      fromSel.value = units.indexOf(prevFrom) >= 0 ? prevFrom : units[0];
      toSel.value = units.indexOf(prevTo) >= 0 && prevTo !== fromSel.value ? prevTo : (units[1] || units[0]);
    }

    /* 换算历史：输入停止 600ms 后记一条，避免逐字符刷屏 */
    let convHistTimer = null;
    function queueConvHistory(fv, fu, tu, resultText) {
      if (convHistTimer) clearTimeout(convHistTimer);
      convHistTimer = setTimeout(function () {
        convHistTimer = null;
        histPush('convert', fv + ' ' + fu + ' → ' + tu, resultText, { fv: fv, fu: fu, tu: tu, cat: currentConvCat });
      }, 600);
    }

    function renderQuick() {
      const box = document.getElementById('convQuick');
      box.innerHTML = '';
      QUICK_AMOUNTS.forEach(function (n) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'quick-chip';
        chip.innerText = n;
        chip.onclick = function () {
          document.getElementById('convFrom').value = n;
          convert(true);
        };
        box.appendChild(chip);
      });
    }

    function convParse(raw) {
      const s = String(raw || '').trim().replace(/,/g, '');
      if (!s) return NaN;
      if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
      return parseFloat(s);
    }

    function convert(record) {
      const fromVal = convParse(document.getElementById('convFrom').value);
      const fromSel = document.getElementById('convFromUnit');
      const toSel = document.getElementById('convToUnit');
      const fromUnit = fromSel.value, toUnit = toSel.value;
      const toEl = document.getElementById('convTo');
      const rateEl = document.getElementById('convRate');
      const tableEl = document.getElementById('convTable');

      if (!fromUnit || !toUnit) return;
      if (!isFinite(fromVal)) {
        toEl.value = '';
        rateEl.innerText = '';
        tableEl.innerHTML = '';
        document.getElementById('convTableTitle').innerText = '';
        return;
      }

      const result = convOne(fromVal, fromUnit, toUnit, currentConvCat);
      toEl.value = fmtNum(result) || T().errInvalid;
      /* 仅用户主动操作时记历史；启动/切语言/汇率刷新/取回记录等自动换算不记 */
      if (record) queueConvHistory(fromVal, fromUnit, toUnit, toEl.value);

      const unitRate = convOne(1, fromUnit, toUnit, currentConvCat);
      let text = T().convRate(fromUnit, toUnit, fmtNum(unitRate, 8) || '—');
      if (currentConvCat === 'currency' && !UNIT_DATA.currency.live) {
        text += ' · ' + T().curOffline;
      }
      rateEl.innerText = text;

      /* 全单位对照表：点击任意行即把该单位设为目标单位 */
      document.getElementById('convTableTitle').innerText = T().convTableTitle(fromUnit);
      const units = unitList(currentConvCat);
      tableEl.innerHTML = '';
      units.forEach(function (u) {
        const row = document.createElement('div');
        row.className = 'ct-row' + (u === toUnit ? ' current' : '');
        const v = convOne(1, fromUnit, u, currentConvCat);
        row.innerHTML = '<span class="ct-unit">' + escapeHtml(u) + '</span><span class="ct-val">' +
          escapeHtml(fmtNum(v, 8) || '—') + '</span>';
        row.onclick = function () {
          toSel.value = u;
          convert(true);
        };
        tableEl.appendChild(row);
      });

      updateCurStatus();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function swapConvert() {
      const fromSel = document.getElementById('convFromUnit');
      const toSel = document.getElementById('convToUnit');
      const tmp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = tmp;
      convert(true);
    }

    function copyResult() {
      const val = document.getElementById('convTo').value;
      const btn = document.getElementById('copyBtn');
      if (!val) return;
      const done = function () {
        btn.innerText = T().copied;
        setTimeout(function () { btn.innerText = T().copy; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(done).catch(function () { legacyCopy(val, done); });
      } else {
        legacyCopy(val, done);
      }
    }

    function legacyCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) { /* 忽略：剪贴板不可用 */ }
      document.body.removeChild(ta);
    }

    /* ---- 实时汇率：依次尝试两个免密钥接口，全部失败则回落到内置参考值 ---- */
    let ratesLoading = false;

    function updateCurStatus() {
      const d = UNIT_DATA.currency;
      const el = document.getElementById('curHintStatus');
      const btn = document.getElementById('curRefresh');
      if (currentConvCat !== 'currency') return;
      if (ratesLoading) {
        el.className = 'cur-hint-status';
        el.innerText = T().curLoading;
        btn.disabled = true;
        btn.innerText = T().curRefresh;
        return;
      }
      btn.disabled = false;
      if (d.live) {
        el.className = 'cur-hint-status live';
        el.innerText = T().curLive(d.source, d.when);
        btn.innerText = T().curRefresh;
      } else {
        el.className = 'cur-hint-status offline';
        el.innerText = T().curOffline;
        btn.innerText = T().curRetry;
      }
    }

    function loadLiveRates(manual) {
      if (ratesLoading) return;
      ratesLoading = true;
      updateCurStatus();
      const endpoints = [
        { url: 'https://open.er-api.com/v6/latest/USD', name: 'open.er-api.com', pick: function (j) { return j && j.rates; } },
        { url: 'https://api.frankfurter.app/latest?from=USD', name: 'frankfurter.app', pick: function (j) { return j && j.rates; } }
      ];

      const tryNext = function (i) {
        if (i >= endpoints.length) { finishFail(); return; }
        const ep = endpoints[i];
        const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 9000) : null;
        fetch(ep.url, { signal: ctrl ? ctrl.signal : undefined })
          .then(function (r) {
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
          })
          .then(function (j) {
            if (timer) clearTimeout(timer);
            const raw = ep.pick(j);
            if (!raw) throw new Error('no rates');
            const wanted = UNIT_DATA.currency.list;
            const out = {};
            wanted.forEach(function (c) {
              if (c === 'USD') out[c] = 1;
              else if (typeof raw[c] === 'number' && isFinite(raw[c]) && raw[c] > 0) out[c] = raw[c];
            });
            /* 至少覆盖 5 种货币才认为可用 */
            if (Object.keys(out).length < 5) throw new Error('too few');
            UNIT_DATA.currency.rates = out;
            UNIT_DATA.currency.live = true;
            UNIT_DATA.currency.source = ep.name;
            const stamp = j.time_last_update_utc || j.date || new Date().toISOString();
            UNIT_DATA.currency.when = String(stamp).slice(0, 16);
            /* 过滤掉接口未返回的货币 */
            UNIT_DATA.currency.list = wanted.filter(function (c) { return !!out[c]; });
            ratesLoading = false;
            renderConvUnits();
            convert();
          })
          .catch(function () {
            if (timer) clearTimeout(timer);
            tryNext(i + 1);
          });
      };

      const finishFail = function () {
        UNIT_DATA.currency.live = false;
        UNIT_DATA.currency.rates = null;
        ratesLoading = false;
        renderConvUnits();
        convert();
      };

      tryNext(0);
    }

    /* ================= SECTION: theme ================= */
    let currentTheme = (function () {
      try {
        const saved = localStorage.getItem('yw_calc_theme');
        if (saved === 'light' || saved === 'dark') return saved;
      } catch (e) { /* 隐私模式下忽略 */ }
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
      } catch (e) { /* 不支持时忽略 */ }
      return 'dark';
    })();

    /* 画布绘制需要的颜色，运行时从 CSS 变量读取，主题切换后重绘即生效 */
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    function canvasTheme() {
      return {
        bg: cssVar('--canvas') || '#101010',
        gridMinor: cssVar('--grid-minor') || 'rgba(255,255,255,.045)',
        gridMajor: cssVar('--grid-major') || 'rgba(255,255,255,.10)',
        axis: cssVar('--axis') || 'rgba(255,255,255,.6)',
        label: cssVar('--axis-label') || 'rgba(255,255,255,.55)',
        name: cssVar('--axis-name') || 'rgba(255,255,255,.75)',
        halo: cssVar('--point-halo') || '#101010',
        objLabel: cssVar('--obj-label') || 'rgba(255,255,255,.8)',
        crosshair: cssVar('--crosshair') || 'rgba(255,255,255,.22)',
        draft: cssVar('--draft') || 'rgba(212,175,55,.7)',
        accent: cssVar('--accent') || '#d4af37'
      };
    }

    function applyTheme() {
      document.documentElement.classList.toggle('light', currentTheme === 'light');
      const meta = document.getElementById('metaTheme');
      if (meta) meta.setAttribute('content', currentTheme === 'light' ? '#f5f4f0' : '#0b0b0b');
      /* 主题按钮只显示图标：浅色下显示月亮（点击转深色），深色下显示太阳 */
      document.querySelectorAll('.js-theme-icon').forEach(function (icon) {
        icon.innerHTML = currentTheme === 'light'
          ? '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'
          : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>';
      });
      drawPlot();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('yw_calc_theme', currentTheme); } catch (e) { /* 忽略 */ }
      applyTheme();
    }

    /* ================= SECTION: info pop + history drawer ================= */
    let infoOpenFor = null;
    function toggleInfo(which) {
      const pop = document.getElementById('infoPop');
      const btn = document.getElementById('info-' + which);
      if (infoOpenFor === which) { closeInfo(); return; }
      const src = { basic: 'basic-hint', scientific: 'sci-hint', plot: 'plot-tip', convert: 'conv-hint' }[which];
      const el = document.getElementById(src);
      document.getElementById('infoPopBody').innerHTML = el ? el.innerHTML : '';
      pop.hidden = false;
      infoOpenFor = which;
      document.querySelectorAll('.head-btn').forEach(function (b) { b.classList.remove('on'); });
      if (btn) btn.classList.add('on');
      positionInfoPop(btn);
    }
    /* callout 定位：优先按钮右侧；放不下则按钮下方（箭头翻到顶部） */
    function positionInfoPop(btn) {
      const pop = document.getElementById('infoPop');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const gap = 12;
      const pw = pop.offsetWidth;
      const vw = document.documentElement.clientWidth;
      pop.classList.remove('below');
      if (r.right + gap + pw + 8 <= vw) {
        pop.style.left = (r.right + gap + window.scrollX) + 'px';
        pop.style.top = Math.max(8, r.top - 10 + window.scrollY) + 'px';
        pop.style.setProperty('--arrow-y', '18px');
      } else {
        pop.classList.add('below');
        const leftVw = Math.max(8, Math.min(vw - pw - 8, r.right - 40));
        pop.style.left = (leftVw + window.scrollX) + 'px';
        pop.style.top = (r.bottom + gap + window.scrollY) + 'px';
        const ax = r.left + r.width / 2 - leftVw;
        pop.style.setProperty('--arrow-x', Math.max(14, Math.min(pw - 22, ax)) + 'px');
      }
    }
    function closeInfo() {
      document.getElementById('infoPop').hidden = true;
      infoOpenFor = null;
      document.querySelectorAll('#info-basic, #info-scientific, #info-plot, #info-convert').forEach(function (b) { b.classList.remove('on'); });
    }
    /* 无 ✕ 按钮：点击提示框外部（i 按钮除外）即关闭 */
    document.addEventListener('click', function (ev) {
      if (!infoOpenFor) return;
      const pop = document.getElementById('infoPop');
      if (pop.contains(ev.target)) return;
      if (ev.target.closest && ev.target.closest('.head-btn')) return;
      closeInfo();
    });

    let histDrawerFor = null;
    function toggleHistDrawer(which) {
      const aside = document.getElementById('hist-' + which);
      const backdrop = document.getElementById('histBackdrop');
      const btn = document.getElementById('histbtn-' + which);
      if (histDrawerFor === which) { closeHistDrawer(); return; }
      closeHistDrawer();
      aside.classList.add('open');
      backdrop.classList.add('show');
      document.body.classList.add('hist-open');
      histDrawerFor = which;
      if (btn) btn.classList.add('on');
      backdrop.onclick = closeHistDrawer;
    }
    function closeHistDrawer() {
      if (!histDrawerFor) return;
      const aside = document.getElementById('hist-' + histDrawerFor);
      const btn = document.getElementById('histbtn-' + histDrawerFor);
      if (aside) aside.classList.remove('open');
      if (btn) btn.classList.remove('on');
      document.getElementById('histBackdrop').classList.remove('show');
      document.body.classList.remove('hist-open');
      histDrawerFor = null;
    }

    /* ================= SECTION: mode + init ================= */
    function switchMode(mode, btn) {
      closeInfo();
      closeHistDrawer();
      document.querySelectorAll('.mode-panel').forEach(function (p) { p.classList.remove('active'); });
      document.querySelectorAll('.rail-item[data-mode]').forEach(function (t) { t.classList.remove('active'); });
      document.getElementById('panel-' + mode).classList.add('active');
      document.querySelectorAll('.rail-item[data-mode="' + mode + '"]').forEach(function (b) { b.classList.add('active'); });
      if (mode === 'plot') requestAnimationFrame(resizePlotCanvas);
      /* 换算页从隐藏变可见后重新测量，恢复箭头可用状态 */
      if (mode === 'convert') requestAnimationFrame(convCatSyncArrows);
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      try { localStorage.setItem('yw_calc_lang', currentLang); } catch (e) { /* 隐私模式下忽略 */ }
      applyLang();
    }

    function applyLang() {
      const t = T();
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('.js-lang-label').forEach(function (el) {
        const txt = currentLang === 'zh' ? 'EN' : '中';
        el.innerText = txt;
        /* EN 为拉丁字母，视觉偏粗，加 latin 类用更细字重与"中"拉平 */
        el.classList.toggle('latin', txt === 'EN');
      });
      document.getElementById('backBtnLabel').innerText = t.nav.utility;
      document.getElementById('backBtn').title = t.backTitle;
      document.getElementById('page-title').innerText = t.basicTitle;
      document.getElementById('sci-title').innerText = t.sciTitle;
      document.getElementById('plot-title').innerText = t.plotTitle;
      document.getElementById('conv-title').innerText = t.convTitle;
      document.getElementById('convHintText').innerText = t.convHint;
      ['basic', 'scientific', 'plot', 'convert'].forEach(function (w) {
        const ib = document.getElementById('info-' + w);
        if (ib) ib.title = t.infoTitle;
        const hb = document.getElementById('histbtn-' + w);
        if (hb) hb.title = t.histBtnTitle;
      });
      if (infoOpenFor) { const w = infoOpenFor; closeInfo(); toggleInfo(w); }
      document.title = t.pageTitle + ' | Yongjian Wang';
      ['basic', 'scientific', 'plot', 'convert'].forEach(function (id, i) {
        document.querySelectorAll('[data-mode="' + id + '"] .rail-label').forEach(function (el) { el.innerText = t.rail[i]; });
      });
      document.getElementById('basic-hint').innerText = t.basicHint;
      document.getElementById('sci-hint').innerText = t.sciHint;
      ['basic', 'scientific', 'convert'].forEach(function (w) {
        document.getElementById('hist-' + w + '-title').innerText = t.histTitle;
        document.getElementById('hist-' + w + '-clear').innerText = t.histClear;
        renderHist(w);
      });
      document.getElementById('plot-tip').innerHTML = t.plotTip;
      document.getElementById('sideAlgebraLabel').innerText = t.ggSideAlgebra;
      document.getElementById('sideToolsLabel').innerText = t.ggSideTools;
      document.getElementById('sideTableLabel').innerText = t.ggSideTable;
      document.getElementById('sideViewLabel').innerText = t.ggSideView;
      document.getElementById('sideKbLabel').innerText = t.ggSideKb;
      document.getElementById('ggToolsTitle').innerText = t.ggSideTools;
      document.getElementById('ggPlusBtn').title = t.ggNewObj;
      document.getElementById('ggInput').placeholder = t.ggInputPh;
      document.getElementById('ggViewTitle').innerText = t.ggViewTitle;
      document.getElementById('ggViewClose').title = t.ggClose;
      document.getElementById('ggViewApply').innerText = t.ggViewApply;
      document.getElementById('ggViewDefault').innerText = t.ggViewDefault;
      document.getElementById('ggViewEqual').innerText = t.ggViewEqual;
      document.getElementById('zb-full').title = document.querySelector('.gg-shell.gg-full') ? t.ggFullExit : t.ggFull;
      document.getElementById('ggStyleTitle').innerText = t.ggStyleTitle;
      document.getElementById('ggTableHint').innerText = t.ggTableHint;
      document.getElementById('ggTableAdd').innerText = t.ggTableAdd;
      document.getElementById('ggSetGrid').innerText = t.ggSetGrid;
      document.getElementById('ggSetMinor').innerText = t.ggSetMinor;
      document.getElementById('ggSetAxes').innerText = t.ggSetAxes;
      document.getElementById('ggSetLabels').innerText = t.ggSetLabels;
      document.getElementById('ggSetSnap').innerText = t.ggSetSnap;
      document.getElementById('copyBtn').innerText = t.copy;
      document.getElementById('curRefresh').innerText = t.curRefresh;
      applyTheme();
      syncAngleUI();
      renderPresets();
      renderConvCategories();
      renderGgList();
      renderToolList();
      renderGgToolbar();
      refreshSciKeys();
      if (ggPane === 'table') ggRenderTable();
      updateGgCalc();
      sRender();
      convert();
      drawPlot();
    }

    /* ---- 键盘输入：按当前激活面板路由 ---- */
    function activeMode() {
      const el = document.querySelector('.mode-panel.active');
      return el ? el.id.replace('panel-', '') : 'basic';
    }

    document.addEventListener('keydown', function (ev) {
      const tag = (ev.target && ev.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      const mode = activeMode();
      const k = ev.key;

      if (mode === 'basic') {
        if (k >= '0' && k <= '9') { bInput(k); ev.preventDefault(); }
        else if (k === '.') { bInput('.'); ev.preventDefault(); }
        else if (k === '+') { bInput('+'); ev.preventDefault(); }
        else if (k === '-') { bInput('-'); ev.preventDefault(); }
        else if (k === '*') { bInput('×'); ev.preventDefault(); }
        else if (k === '/') { bInput('÷'); ev.preventDefault(); }
        else if (k === 'Enter' || k === '=') { bInput('='); ev.preventDefault(); }
        else if (k === 'Backspace') { bInput('⌫'); ev.preventDefault(); }
        else if (k === 'Escape') { bInput('AC'); ev.preventDefault(); }
        else if (k === '%') { bInput('%'); ev.preventDefault(); }
      } else if (mode === 'scientific') {
        if ((k >= '0' && k <= '9') || k === '.' || k === '(' || k === ')' || k === '^' || k === '!' || k === '%') { sInput(k); ev.preventDefault(); }
        else if (k === '+') { sInput('+'); ev.preventDefault(); }
        else if (k === '-') { sInput('-'); ev.preventDefault(); }
        else if (k === '*') { sInput('×'); ev.preventDefault(); }
        else if (k === '/') { sInput('÷'); ev.preventDefault(); }
        else if (k === 'Enter' || k === '=') { sInput('='); ev.preventDefault(); }
        else if (k === 'Backspace') { sInput('⌫'); ev.preventDefault(); }
        else if (k === 'Escape') { sInput('AC'); ev.preventDefault(); }
      } else if (mode === 'plot') {
        if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) ggRedo(); else ggUndo(); }
        else if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'y') { ev.preventDefault(); ggRedo(); }
        else if ((k === 'Delete' || k === 'Backspace') && ggSelected) {
          ev.preventDefault();
          ggPushHistory();
          ggDeleteObject(ggSelected);
          afterChange();
        } else if (k === 'Escape') {
          if (infoOpenFor) { closeInfo(); return; }
          if (histDrawerFor) { closeHistDrawer(); return; }
          const drawer = document.getElementById('ggViewDrawer');
          if (drawer && drawer.classList.contains('open')) { ggOpenView(); return; }
          const shell = document.querySelector('.gg-shell');
          if (shell && shell.classList.contains('gg-full')) { ggToggleFull(); return; }
          ggPending = []; ggDraftPoly = null; drawPlot();
        }
      }
    });

    /* ---- 事件绑定 ---- */
    document.getElementById('convFrom').addEventListener('input', function () { convert(true); });
    document.getElementById('convFromUnit').addEventListener('change', function () { convert(true); });
    document.getElementById('convToUnit').addEventListener('change', function () { convert(true); });

    let resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (document.getElementById('panel-plot').classList.contains('active')) resizePlotCanvas();
        if (ggKbOpen) ggSyncKbDock();
        ggSyncViewSheetMode();
        convCatSyncArrows();
      }, 120);
    });

    /* 分类栏滚动（手势/触摸板）时同步箭头可用状态 */
    document.getElementById('convCategories').addEventListener('scroll', convCatSyncArrows, { passive: true });

    /* 点击遮罩关闭底部弹出的 view 设置面板 */
    document.getElementById('viewBackdrop').onclick = function () {
      const d = document.getElementById('ggViewDrawer');
      if (d.classList.contains('open')) ggOpenView();
    };

    /* 用户直接编辑/点按输入框时同步光标变量，保证屏幕键盘插入位置正确 */
    (function () {
      const inp = document.getElementById('ggInput');
      const sync = function () { if (inp.selectionStart !== null) ggCaret = inp.selectionStart; };
      inp.addEventListener('input', sync);
      inp.addEventListener('click', sync);
      inp.addEventListener('keyup', sync);
    })();

    /* ---- 启动 ---- */
    buildBasicKeys();
    bRender();
    buildSciKeys();
    /* 绘图页初始为空白画布，函数由用户自行输入或点击预设创建 */
    ggSetTool('move');
    renderGgToolbar();
    renderToolList();
    renderGgList();
    updateGgCalc();
    renderPresets();
    renderConvCategories();
    renderConvUnits();
    renderQuick();
    renderHist('basic');
    renderHist('scientific');
    renderHist('convert');
    applyLang();
    bindPlotEvents();
    resizePlotCanvas();
  </script>
</body>
</html>
